# Official Smart Node networks. `rocketpool service install` always overwrites
# ~/.rocketpool/networks-default.yml with this file.
#
# To add or override a network without rebuilding, create
# ~/.rocketpool/networks-extra.yml using the same schema (version + networks).
# Same-name entries in the extra file replace the official ones; new names are
# appended and appear in `rocketpool service config`.
# Extra networks may omit addresses to run execution/consensus clients on a
# chain that has no Rocket Pool contracts.
